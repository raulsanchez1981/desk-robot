<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Robot virtual</title>
<style>
  :root {
    --on: #ffffff;           /* píxeles encendidos */
    --off: #000000;          /* fondo de la pantalla */
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--off); user-select: none; }
  body { font-family: "Cascadia Mono", Consolas, monospace; }
  /* La ventana es la pantalla del robot (128x64, 2:1). Se arrastra desde cualquier punto menos el asa. */
  #screen { position: absolute; inset: 0; perspective: 500px; overflow: hidden; }
  /* La cara se desplaza y gira con el cuello simulado: sin carcasa, el giro de la cabeza se ve en la pantalla. */
  #plate { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }
  canvas, #clock { width: 100%; height: 100%; display: block; }
  canvas { image-rendering: pixelated; }
  #clock {
    display: none; color: var(--on); flex-direction: column; justify-content: center; align-items: center;
    line-height: 1;
  }
  #clock .time { font-size: 34vh; letter-spacing: .04em; }
  #clock .date { font-size: 10vh; opacity: .75; margin-top: 5vh; }
  body.clock #clock { display: flex; }
  body.clock canvas { display: none; }
  /* Asa para cambiar el tamaño (la ventana no tiene bordes). */
  #grip {
    position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; opacity: 0;
    background: linear-gradient(135deg, transparent 50%, var(--on) 50% 58%, transparent 58% 70%,
                var(--on) 70% 78%, transparent 78%);
    transition: opacity .2s;
  }
  body:hover #grip { opacity: .35; }
  #grip:hover { opacity: .9 !important; }
</style>
</head>
<body>
<div id="screen" class="pywebview-drag-region">
  <div id="plate" class="pywebview-drag-region">
    <canvas id="face" width="128" height="64" class="pywebview-drag-region"></canvas>
    <div id="clock" class="pywebview-drag-region"><div class="time">--:--</div><div class="date"></div></div>
  </div>
</div>
<div id="grip" title="Arrastra para cambiar el tamaño"></div>
<script src="facekit.js"></script>
<script src="robot.js"></script>
</body>
</html>
